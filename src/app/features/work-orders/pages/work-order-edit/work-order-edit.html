<section>
  <div class="d-flex justify-between py-lg">
    <h1>Editar Orden de Trabajo</h1>
    <app-button variant="primary" (clicked)="navigateToWorkOrdersList()">
      Volver a Lista
    </app-button>
  </div>
  @if (loadError() === 'not-found') {
  <app-alert title="Orden no encontrada" message="La orden de trabajo solicitada no existe o fue eliminada."
    variant="error" />
  <app-button variant="primary" (clicked)="retry()">
    Reintentar
  </app-button>

  } @else if (loadError() === 'connection') {
  <app-alert title="Error de conexión" message="No pudimos conectar con el servidor. Intentá nuevamente."
    variant="error" />
  <app-button variant="primary" (clicked)="retry()">
    Reintentar
  </app-button>

  } @else if (workOrder(); as workOrder) {
  <app-form mode="edit" [inputData]="workOrder" (sendData)="onSubmitEdit($event)" />
  }
</section>
