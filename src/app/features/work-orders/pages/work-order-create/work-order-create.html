<section>
  <div class="d-flex flex-wrap justify-between gap-md py-lg">
    <h1>Crear Orden de Trabajo</h1>
    <app-button variant="primary" (clicked)="navigateToWorkOrdersList()">
      Volver a Lista
    </app-button>
  </div>
  <app-form
    [allowedTypes]="allowedTypes()"
    [submitting]="isSubmitting()"
    (sendData)="onSubmit($event)"
  ></app-form>
</section>
