<section>
  <div class="d-flex flex-wrap justify-between gap-md py-lg">
    <h1>Crear Orden de Trabajo</h1>
    <app-button variant="primary" (clicked)="navigateToWorkOrdersList()">
      Volver a Lista
    </app-button>
  </div>

  @if (machinesError()) {
    <app-alert
      title="Error de conexión"
      message="No se pudieron cargar las máquinas. Sin ellas no se puede crear una orden."
      variant="error"
    />
    <app-button variant="primary" (clicked)="loadMachines()"> Reintentar </app-button>
  } @else {
    @if (partsError()) {
      <app-alert
        title="Partes no disponibles"
        message="No se pudieron cargar las partes de la máquina. Podés crear la orden sobre la máquina completa o volver a elegirla."
        variant="warning"
      />
    }
    @if (machineRefError(); as refError) {
      <app-alert title="Máquina o parte no válida" [message]="refError" variant="error" />
    }
    <app-form
      [allowedTypes]="allowedTypes()"
      [submitting]="isSubmitting()"
      [machines]="machines()"
      [partNodes]="partNodes()"
      [serverErrors]="fieldErrors()"
      (machineChange)="onMachineChange($event)"
      (sendData)="onSubmit($event)"
    ></app-form>
  }
</section>
