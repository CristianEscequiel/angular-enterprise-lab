<section class="">
  <div class="d-flex justify-between py-lg">
    <h1>Detalle de la orden de trabajo</h1>
    <app-button variant="primary" (clicked)="navigateToWorkOrdersList()">
      Volver a Lista
    </app-button>
  </div>

  <div class="card">
    <div class="card__body">
      <p class="card__header"><strong>{{ workOrderDetail()?.title }} </strong></p>
      <div class="card__content">
        <p class="card__tittle">{{ workOrderDetail()?.asset }}</p>
        <p class="card__description">{{ workOrderDetail()?.description }}</p>
      </div>
      <p class="card__footer"> {{ workOrderDetail()?.status }}</p>
    </div>
  </div>
</section>
