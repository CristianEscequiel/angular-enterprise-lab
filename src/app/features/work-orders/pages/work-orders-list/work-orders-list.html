<section class="text-center">
  <div class="d-flex justify-between py-lg">
    <h1>Órdenes de trabajo</h1>
    <app-button variant="primary" (clicked)="navigateToCreateWorkOrder()">
      Crear orden de trabajo
    </app-button>
  </div>

  @if (error()) {
  <app-alert title="Error" [message]="error()!" variant="error" />
  <app-button variant="primary" (clicked)="loadWorkOrders()">
    Reintentar
  </app-button>

  } @else if (workOrders().length === 0) {
  <app-alert title="Sin órdenes" message="No existen órdenes de trabajo registradas." variant="info" />
  } @else {

  <table class="table">
    <thead>
      <tr>
        <th>Título</th>
        <th>Activo</th>
        <th>Estado</th>
        <th class="text-center">Acciones</th>
      </tr>
    </thead>
    <tbody>
      @for (workOrder of workOrders(); track workOrder.id) {
      <tr class="table__row table__row--clickable">
        <td>{{ workOrder.title }}</td>
        <td>{{ workOrder.asset }}</td>
        <td>
          <app-badge [variant]="workOrder.status">
            {{ workOrder.status }}
          </app-badge>
        </td>
        <td class="d-flex justify-center gap-sm">
          <app-button size="sm" variant="outline" (clicked)="viewWorkOrder(workOrder.id)">
            Ver
          </app-button>
          <app-button size="sm" variant="secondary" (clicked)="editWorkOrder(workOrder.id)">
            Editar
          </app-button>
          <app-button size="sm" variant="danger" (clicked)="openDeleteModal()">
            Eliminar
          </app-button>
          <app-modal [(isOpen)]="deleteModalOpen" title="Eliminar orden de trabajo"
            message="¿Estás seguro de que querés eliminar esta orden? Esta acción no se puede deshacer."
            confirmText="Eliminar" cancelText="Cancelar" (confirmed)="deleteWorkOrder(workOrder.id)" />
        </td>
      </tr>
      }
    </tbody>
  </table>
  }
</section>
