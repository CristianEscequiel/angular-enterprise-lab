<section class="text-center">
  <h1 class="p-lg">Órdenes de trabajo</h1>
  @if (error()) {
  <app-alert title="Error" [message]="error()!" variant="error" />
  <app-button variant="primary" (clicked)="loadWorkOrders()">
    Reintentar
  </app-button>

  } @else if (workOrders().length === 0) {
  <app-alert title="Sin órdenes" message="No existen órdenes de trabajo registradas." variant="info" />
  } @else {

  <table class="table">
    <thead>
      <tr>
        <th>Título</th>
        <th>Activo</th>
        <th>Estado</th>
        <th>Acciones</th>
      </tr>
    </thead>
    <tbody>
      @for (workOrder of workOrders(); track workOrder.id) {
      <tr class="table__row table__row--clickable">
        <td>{{ workOrder.title }}</td>
        <td>{{ workOrder.asset }}</td>
        <td>
          <app-badge [variant]="workOrder.status">
            {{ workOrder.status }}
          </app-badge>
        </td>
        <td>
          <app-button size="sm" variant="secondary" (clicked)="viewWorkOrder(workOrder.id)">
            Ver
          </app-button>
        </td>
      </tr>
      }
    </tbody>
  </table>
  }
</section>
