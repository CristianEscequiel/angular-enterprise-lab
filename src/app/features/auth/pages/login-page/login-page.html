<section class="login">
  <h1>Iniciar sesión</h1>

  @if (errorMessage(); as message) {
    <app-alert variant="error" title="No se pudo iniciar sesión" [message]="message" />
  }

  <form class="form" [formGroup]="loginForm" (ngSubmit)="onSubmit()">
    <label class="form-label" for="username">Usuario:</label>
    <input
      class="form-control"
      id="username"
      formControlName="username"
      autocomplete="username"
      required
      [class.form-control--invalid]="isInvalid('username')"
      [attr.aria-invalid]="isInvalid('username')"
      [attr.aria-describedby]="isInvalid('username') ? 'username-error' : null"
    />
    @if (isInvalid('username')) {
      <div class="form-error" id="username-error">El usuario es obligatorio.</div>
    }

    <label class="form-label" for="password">Contraseña:</label>
    <input
      class="form-control"
      id="password"
      type="password"
      formControlName="password"
      autocomplete="current-password"
      required
      [class.form-control--invalid]="isInvalid('password')"
      [attr.aria-invalid]="isInvalid('password')"
      [attr.aria-describedby]="isInvalid('password') ? 'password-error' : null"
    />
    @if (isInvalid('password')) {
      <div class="form-error" id="password-error">
        La contraseña es obligatoria y debe tener al menos 6 caracteres.
      </div>
    }

    <app-button type="submit" size="full" variant="primary" [disabled]="submitting()">{{
      submitting() ? 'Ingresando...' : 'Ingresar'
    }}</app-button>
  </form>
</section>
