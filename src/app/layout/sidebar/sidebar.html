<aside id="app-sidebar" class="sidebar-layout__sidebar sidebar">
  <button
    #closeButton
    class="btn btn--close"
    type="button"
    aria-label="Cerrar menú de navegación"
    (click)="closeSidebar()"
  >
    ✕
  </button>
  <p class="u-text-muted pb-md">Menú</p>

  <nav class="sidebar__nav" aria-label="Navegación principal">
    <a
      class="sidebar__link"
      routerLink="/dashboard"
      routerLinkActive="sidebar__link--active"
      #inicioLink="routerLinkActive"
      [attr.aria-current]="inicioLink.isActive ? 'page' : null"
      >Inicio</a
    >
    <a
      class="sidebar__link"
      routerLink="/work-orders"
      routerLinkActive="sidebar__link--active"
      #ordenesLink="routerLinkActive"
      [attr.aria-current]="ordenesLink.isActive ? 'page' : null"
      >Órdenes</a
    >
  </nav>
</aside>
