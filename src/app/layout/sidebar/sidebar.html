<aside class="sidebar">
  <nav class="sidebar__nav" aria-label="Navegación principal">
    @for (item of navItems(); track item.path) {
      <a
        class="sidebar__link"
        [routerLink]="item.path"
        routerLinkActive="sidebar__link--active"
        ariaCurrentWhenActive="page"
        >{{ item.label }}</a
      >
    }
  </nav>
</aside>
