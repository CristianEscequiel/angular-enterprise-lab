<header class="header">
  <!-- Es el nombre del sitio, no un encabezado: cada página tiene su propio h1. -->
  <p class="header__title">Centro de Gestión de Mantenimiento</p>
  @if (userName() !== null) {
    <div class="header__session">
      <span class="header__user">{{ userName() }}</span>
      <app-button variant="outline" size="sm" (clicked)="onLogoutClick()">Cerrar sesión</app-button>
    </div>
  }
</header>
