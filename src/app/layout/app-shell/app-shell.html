<app-header [sidebarOpen]="sidebarOpen()" (viewSidebar)="openSidebar()"></app-header>

<div [class.sidebar-layout]="sidebarOpen()">
  @if (sidebarOpen()) {
    <div class="sidebar-backdrop" role="presentation" (click)="closeSidebar()"></div>
    <app-sidebar (closed)="closeSidebar()" />
  }
  <main id="main-content" class="container sidebar-layout__content">
    <router-outlet></router-outlet>
  </main>
</div>
