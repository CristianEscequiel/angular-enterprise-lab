<!-- Mobile: header, contenido y barra inferior fija. Desde md: sidebar fija a la izquierda. Cuál de
     las dos navegaciones se ve lo decide el CSS (styles/layout/_shell.scss). -->
<div class="shell" [class.shell--with-nav]="isAuthenticated()">
  <app-header class="shell__header" [userName]="userName()" (logout)="onLogout()"></app-header>

  @if (isAuthenticated()) {
    <app-sidebar class="shell__sidebar" />
  }

  <main id="main-content" class="container sidebar-layout__content">
    <router-outlet></router-outlet>
  </main>

  @if (isAuthenticated()) {
    <app-bottom-nav />
  }
</div>
