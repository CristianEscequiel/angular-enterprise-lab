server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # SPA: cualquier ruta que no sea un archivo devuelve index.html
  # (el router de Angular resuelve la ruta en el navegador).
  location / {
    try_files $uri $uri/ /index.html;
  }

  # JS y CSS llevan hash en el nombre (outputHashing: all): se pueden cachear un año.
  location ~* \.(?:js|css)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # index.html nunca se cachea: apunta a los archivos con hash de la versión actual.
  location = /index.html {
    add_header Cache-Control "no-cache";
  }
}
